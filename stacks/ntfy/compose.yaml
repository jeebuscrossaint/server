# ntfy: push notifications to your phone. https://ntfy.lab, no login (Caddy signs you in).
# Your phone isn't on Tailscale, so it reaches ntfy through Tailscale Funnel, which
# forwards https://<PUBLIC_DOMAIN>:10000 to Caddy on 127.0.0.1:3002. Turn it on once with:
#   sudo tailscale funnel --bg --https=10000 3002
# Nobody gets in without signing in there: in the ntfy app, add that address as the
# server, with user "lab" and NTFY_PASSWORD from .env. install.sh makes the user.
services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: https://${PUBLIC_DOMAIN}:10000
      NTFY_LISTEN_HTTP: :80
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      # iPhones only get pushes quickly through ntfy.sh (it sees a message ID, not the message)
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - ./data:/var/lib/ntfy
    networks: [proxy]

networks:
  proxy:
    external: true
