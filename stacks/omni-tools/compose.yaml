# OmniTools: 100+ handy tools (images, video, PDFs, text, JSON, converters...), all run in your browser. https://tools.lab
services:
  omni-tools:
    image: iib0011/omni-tools:latest
    container_name: omni-tools
    restart: unless-stopped
    networks: [proxy]

networks:
  proxy:
    external: true
