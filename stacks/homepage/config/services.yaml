# Each tile: href is where clicking goes, container shows running/stopped.
- Tools:
    - BentoPDF:
        icon: bentopdf.png
        href: https://pdf.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: edit, merge, split, convert PDFs
        server: local
        container: bentopdf
    - Transmute:
        icon: mdi-swap-horizontal
        href: https://convert.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: convert any file to any file
        server: local
        container: transmute
    - SearXNG:
        icon: searxng.png
        href: https://search.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: private search
        server: local
        container: searxng
    - Changedetection:
        icon: changedetection.png
        href: https://changes.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: get pinged when a website changes
        server: local
        container: changedetection

    - ExcaliDash:
        icon: excalidraw.png
        href: https://draw.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: whiteboard, keeps all your drawings
        server: local
        container: excalidash

    - Overleaf:
        icon: overleaf.png
        href: https://latex.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: LaTeX with autocomplete
        server: local
        container: overleaf

    - Karakeep:
        icon: karakeep.png
        href: https://keep.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: bookmarks with saved copies, searchable
        server: local
        container: karakeep

    - Pingvin Share:
        icon: pingvin-share.png
        href: https://share.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: upload a file, send anyone the link
        server: local
        container: pingvin
    - IT-Tools:
        icon: it-tools.png
        href: https://tools.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: converters, encoders, QR codes, hashes
        server: local
        container: it-tools

- System:
    - Terminal:
        icon: mdi-console
        href: https://term.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: a shell on the server, in the browser
        server: local
        container: terminal
    - Dockge:
        icon: dockge.png
        href: https://dockge.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: start, stop, edit stacks
        server: local
        container: dockge
    - Dozzle:
        icon: dozzle.png
        href: https://logs.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: live logs for every app
        server: local
        container: dozzle
    - Glances:
        icon: glances.png
        href: https://top.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: btop in the browser
        server: local
        container: glances
    - Beszel:
        icon: beszel.png
        href: https://stats.{{HOMEPAGE_VAR_LAB_DOMAIN}}
        description: CPU, RAM, temps, containers
        server: local
        container: beszel
    - Snowflake:
        icon: tor.png
        description: helping people in censored countries reach Tor
        server: local
        container: snowflake
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_TAILSCALE_IP}}:9998/stats.json
          refreshInterval: 60000
          mappings:
            - field: helped
              label: People helped
              format: number
            - field: relayed_mb
              label: MB relayed
              format: number
            - field: top_country
              label: Most from
