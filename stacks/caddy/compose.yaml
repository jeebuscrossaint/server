# Caddy: turns https://pdf.lab etc. into the right container. Edit Caddyfile to add sites.
services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports: # Tailscale only, not the Wi-Fi/LAN (see system/sysctl-tailscale-bind.conf)
      - ${TAILSCALE_IP}:80:80
      - ${TAILSCALE_IP}:443:443
      - 127.0.0.1:3001:3001 # Gokapi's public links, only for Funnel
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN}
      OVERLEAF_PASSWORD: ${OVERLEAF_PASSWORD}
      TRANSMUTE_PASSWORD: ${TRANSMUTE_PASSWORD}
      READECK_PASSWORD: ${READECK_PASSWORD}
      NEXTERM_PASSWORD: ${NEXTERM_PASSWORD}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pages:/srv/pages:ro
      - ./data:/data
    networks: [proxy]

networks:
  proxy:
    external: true
